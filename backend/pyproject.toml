[project]
name = "comanda"
version = "0.1.0"
description = "Orquestração multi-agente para atendimento ao cliente de delivery, com regras de negócio aplicadas em código e avaliação automática."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "André Vinícius Diz Freitas" }]
dependencies = [
    "claude-agent-sdk>=0.2",
    "fastapi>=0.162.2",
    "httpx>=0.28",
    "mcp>=2.0",
    "pyyaml>=6",
    "uvicorn>=0.54.0",
]

[project.scripts]
comanda = "comanda.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.12",
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Travessão é tipografia correta em português (por exemplo, "11:00–23:30").
allowed-confusables = ["–"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
